falsifier:
  zh: Apple 的公告中不存在可被第三方独立验证的证明链（度量值、签名者、验证工具），则本报告据此推出的「Apple 买的是远程证明」一说不成立
  en: If Apple's disclosure contains no independently verifiable attestation chain, the inference that Apple is buying remote attestation does not hold
