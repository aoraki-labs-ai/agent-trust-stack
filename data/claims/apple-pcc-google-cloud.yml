id: apple-pcc-google-cloud
kind: event
statement:
  zh: 2026-06-08，Apple 宣布 Private Cloud Compute 首次在自有机房之外运行，最吃算力的请求转至 Google Cloud 的 NVIDIA Blackwell GPU（开启机密计算）与 Intel TDX CPU 上
  en: On 2026-06-08 Apple announced Private Cloud Compute running outside its own data centres for the first time, with the heaviest requests served on Google Cloud's NVIDIA Blackwell GPUs in confidential computing mode and Intel TDX CPUs
