id: webbotauth-production
kind: event
statement:
  zh: Cloudflare 于 2026-03 在边缘生产环境启用 Web Bot Auth；该机制基于 RFC 9421 HTTP 消息签名与 Ed25519 密钥
  en: Cloudflare activated Web Bot Auth in production at its edge in 2026-03, built on RFC 9421 HTTP Message Signatures and Ed25519 keys
