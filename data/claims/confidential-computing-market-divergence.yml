id: confidential-computing-market-divergence
kind: quantity
statement:
  zh: 各家对机密计算市场的预测口径差异极大：MarketsandMarkets 给 2023 年 53 亿美元到 2028 年 594 亿美元（CAGR 62.1%），另有机构给出 2026 年 151 亿与 181 亿美元两个相差悬殊的基数
  en: "Confidential computing market forecasts diverge sharply: MarketsandMarkets gives $5.3B in 2023 to $59.4B in 2028 (62.1% CAGR), while other houses put the 2026 base at $15.1B and $18.1B respectively"
