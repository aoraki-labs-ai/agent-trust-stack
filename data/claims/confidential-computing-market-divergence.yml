notes:
  zh: 本条的用途是展示分歧本身，不是给出规模依据。禁止跨来源取平均。2026 年基数的两个数字尚未回溯到各自的一手报告页。
  en: This record exists to show the divergence, not to supply a size estimate. Never average across houses. The two 2026 base figures have not yet been traced to their own report pages.
