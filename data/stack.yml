# Chapter 04. Ordered top to bottom as the page renders them.
- id: L4
  name: { zh: 治理与举证, en: Governance and evidence }
  question:
    zh: 出了事，我拿什么举证？
    en: When something goes wrong, what do I produce as evidence?
  note:
    zh: 这一层几乎不含新密码学，全是流程、日志与凭证管理，却是 2026 年预算最确定的一层。
    en: Almost no new cryptography here — process, logs and credential management — yet it is the layer with the most certain budget in 2026.
  chips:
    - { label: { zh: AI 治理平台, en: AI governance platforms }, family: protocol }
    - { label: { zh: 防篡改审计日志, en: Tamper-evident audit logs }, family: protocol }
    - { label: DigiCert AI Trust Manager, family: protocol }
    - { label: CrowdStrike Agentic IdP, family: protocol }
    - { label: Entrust Agentic Trust, family: protocol }
    - { label: { zh: C2PA 内容凭证, en: C2PA content credentials }, family: protocol }
    - { label: { zh: AI Act 第 12 条, en: AI Act Article 12 }, family: protocol }
- id: L3
  name: { zh: Agent 信任协议, en: Agent trust protocols }
  question:
    zh: 这个请求是谁发的、谁授权的、上限多少？
    en: Who sent this request, who authorised it, up to what limit?
  note:
    zh: 2026 年标准战打得最激烈的一层，支付网络、CDN、以太坊社区三方各出一套。
    en: The most contested layer of 2026, with the payment networks, the CDNs and the Ethereum community each proposing their own.
  chips:
