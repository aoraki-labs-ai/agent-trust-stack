- id: L1
  name: { zh: 证明与密码学原语, en: Attestation and cryptographic primitives }
  question:
    zh: 凭什么信？
    en: On what basis should any of it be believed?
  note:
    zh: 远程证明是「机密」与「可验证」的唯一接缝：它本身就是一份关于硬件状态的、可被第三方验签的声明。
    en: Remote attestation is the one seam between confidentiality and verifiability — it is itself a third-party-checkable statement about hardware state.
  chips:
    - { label: { zh: 远程证明 / NRAS, en: Remote attestation / NRAS }, family: hardware }
    - { label: { zh: ZK（zkVM / zkML）, en: "ZK (zkVM / zkML)" }, family: crypto }
    - { label: { zh: FHE（TFHE / CKKS / BFV）, en: "FHE (TFHE / CKKS / BFV)" }, family: crypto }
    - { label: MPC, family: crypto }
    - { label: { zh: zkTLS（MPC 模式 / Proxy 模式）, en: "zkTLS (MPC and proxy modes)" }, family: crypto }
