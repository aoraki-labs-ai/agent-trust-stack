    - { label: Mastercard Agent Pay, family: protocol }
    - { label: Google AP2, family: protocol }
    - { label: x402, family: protocol }
    - { label: ERC-8004, family: protocol }
    - { label: { zh: MCP 授权, en: MCP authorisation }, family: protocol }
